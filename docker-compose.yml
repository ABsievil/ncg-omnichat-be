services:
  api:
    image: ${API_IMAGE:-ncg-omnichat-be:local}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnichat-api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${PORT:-8090}
    ports:
      - '${PORT:-8090}:${PORT:-8090}'
    depends_on:
      - mongodb
      - redis
      - minio

  worker:
    image: ${API_IMAGE:-ncg-omnichat-be:local}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnichat-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ['node', 'dist/worker/main.worker.js']
    env_file:
      - .env
    environment:
      NODE_ENV: development
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:7
    container_name: omnichat-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - omnichat_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: omnichat-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - omnichat_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: omnichat-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-omnichat}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-omnichat_secret}
    command: server /data --console-address ":9001"
    volumes:
      - omnichat_minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-omnichat}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-omnichat_secret}
      R2_BUCKET: ${R2_BUCKET:-omnichat-media}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $$R2_ACCESS_KEY_ID $$R2_SECRET_ACCESS_KEY;
      mc mb -p local/$$R2_BUCKET || true;
      mc anonymous set download local/$$R2_BUCKET || true;
      exit 0;
      "

volumes:
  omnichat_mongo_data:
  omnichat_redis_data:
  omnichat_minio_data:
