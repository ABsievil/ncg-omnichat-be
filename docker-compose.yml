services:
  mongodb:
    image: mongo:7
    container_name: omnichat-mongo
    ports:
      - '27017:27017'
    volumes:
      - omnichat_mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: omnichat-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - omnichat_redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: omnichat-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: omnichat
      MINIO_ROOT_PASSWORD: omnichat_secret
    command: server /data --console-address ":9001"
    volumes:
      - omnichat_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 omnichat omnichat_secret;
      mc mb -p local/omnichat-media || true;
      mc anonymous set download local/omnichat-media || true;
      exit 0;
      "

volumes:
  omnichat_mongo_data:
  omnichat_redis_data:
  omnichat_minio_data:
