name: Deploy VPS

on:
    push:
        branches:
            - build
    workflow_dispatch:

concurrency:
    group: deploy-vps-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Prepare image metadata
              id: meta
              shell: bash
              run: |
                  echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
                  echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
                  APP_DIR="${{ secrets.VPS_DEPLOY_PATH || vars.VPS_DEPLOY_PATH }}"
                  if [ -z "$APP_DIR" ]; then
                    echo "Missing VPS_DEPLOY_PATH secret or variable"
                    exit 1
                  fi
                  echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
                      ${{ steps.meta.outputs.image_name }}:latest

            - name: Copy deploy files to VPS
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_SSH_PORT || vars.VPS_SSH_PORT || 22 }}
                  source: docker-compose.yml,deploy.sh
                  target: ${{ steps.meta.outputs.app_dir }}
                  overwrite: true

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.2.1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_SSH_PORT || vars.VPS_SSH_PORT || 22 }}
                  timeout: 60m
                  command_timeout: 50m
                  script: |
                      set -euo pipefail

                      APP_DIR="${{ steps.meta.outputs.app_dir }}"
                      cd "$APP_DIR"

                      if [ ! -f .env ]; then
                        echo "Missing .env in $APP_DIR — create it on the VPS once, then re-run."
                        exit 1
                      fi
                      if [ ! -f ./deploy.sh ]; then
                        echo "deploy.sh not found in $APP_DIR after SCP"
                        exit 1
                      fi
                      if [ ! -f ./docker-compose.yml ]; then
                        echo "docker-compose.yml not found in $APP_DIR after SCP"
                        exit 1
                      fi

                      chmod +x ./deploy.sh

                      IMAGE_NAME="${{ steps.meta.outputs.image_name }}" \
                      IMAGE_TAG="${{ steps.meta.outputs.image_tag }}" \
                      REGISTRY_HOST="ghcr.io" \
                      REGISTRY_USERNAME="${{ secrets.GHCR_USERNAME }}" \
                      REGISTRY_TOKEN="${{ secrets.GHCR_TOKEN }}" \
                      APP_DIR="$APP_DIR" \
                      bash ./deploy.sh
